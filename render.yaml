services:
  - type: web
    name: theez-bot
    runtime: python
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m app.bot.main
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: TOKEN_TTL_SEC
        value: "60"
      - key: SHIPSTARS_KEY
        sync: false
      - key: USDT_TRC20_ADDR
        sync: false
      - key: USDT_WATCHER_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: STORAGE_ROOT
        value: ./storage
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_URL_TTL_SEC
        value: "300"
      - key: KEEPALIVE_INTERVAL_SEC
        value: "300"
      - key: DROP_PENDING_UPDATES
        value: "false"
